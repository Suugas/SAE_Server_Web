<h1>Exemple avec la date</h1>

<h2>En Python — date et heure</h2>
<p>La date est <code interpreteur="/usr/bin/python">
    import datetime; print(datetime.datetime.now().strftime("%A %d %B %Y, %H:%M:%S"))
</code></p>

<h2>En Python — timestamp</h2>
<p>Le timestamp est <code interpreteur="/usr/bin/python">
    import time; print(time.time())
</code></p>

<h2>En Python — version</h2>
<p>Version Python : <code interpreteur="/usr/bin/python">
    import sys; print(sys.version)
</code></p>
